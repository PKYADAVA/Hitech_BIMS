<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- A hen in profile, facing left. Built from rounded primitives so it holds
       together at 14px: a three-lobed comb, a round head with a wedge beak and
       a wattle, a neck into a deep body, a fanned tail, two legs with toes. -->
  <!-- comb: three lobes, not spikes -->
  <circle cx="6.65" cy="4.15" r="1.0"/>
  <circle cx="7.95" cy="3.5" r="1.1"/>
  <circle cx="9.25" cy="4.0" r="1.0"/>
  <!-- head -->
  <circle cx="8.0" cy="6.1" r="2.35"/>
  <!-- beak -->
  <path d="M6.0 5.1 3.0 6.15 6.0 7.3z"/>
  <!-- wattle -->
  <circle cx="7.15" cy="8.5" r="1.0"/>
  <!-- neck into the shoulders -->
  <path d="M6.2 7.6c.3 1.6 1.1 2.9 2.4 3.8l3.5-2.3c-1.0-.7-1.7-1.7-2.0-3.0z"/>
  <!-- body: a deep breast at the front, the mass tapering back to the tail -->
  <circle cx="9.9" cy="13.4" r="3.9"/>
  <ellipse cx="12.6" cy="13.8" rx="5.6" ry="4.3" transform="rotate(-14 12.6 13.8)"/>
  <!-- tail: one fan, notched twice, rather than loose feathers -->
  <path d="M15.6 11.4c1.4-2.6 3.1-4.6 5.2-5.9-.75 1.7-1.05 3.15-.9 4.4 1.15-1.0 2.3-1.55 3.5-1.65-1.2 1.25-1.95 2.6-2.2 4.05 1.1-.4 2.1-.4 3.0.05-2.0.55-3.5 1.6-4.6 3.15z"/>
  <!-- legs -->
  <path d="M10.15 17.6h1.15v3.3h-1.15z"/>
  <path d="M13.45 17.6h1.15v3.3h-1.15z"/>
  <!-- toes, forward of each leg -->
  <path d="M8.6 20.5h2.9v1.25H8.6z"/>
  <path d="M11.9 20.5h2.9v1.25h-2.9z"/>
</svg>
