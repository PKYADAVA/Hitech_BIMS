<svg xmlns="http://www.w3.org/2000/svg" viewBox="2.6 2.05 21.9 20.5">
  <!-- A hen in profile, facing left, drawn with the weight of the solid font
       icons it sits beside: those lay down half their box in ink and more, so
       thin legs and loose tail feathers read as a smaller, fainter icon even
       at the same height. Comb, head, beak, wattle, neck, deep body, a solid
       fanned tail, two legs with toes. The box is cropped to the drawing. -->
  <!-- comb: three lobes -->
  <circle cx="6.8" cy="4.05" r="1.15"/>
  <circle cx="8.1" cy="3.3" r="1.25"/>
  <circle cx="9.45" cy="3.9" r="1.15"/>
  <!-- head -->
  <circle cx="8.3" cy="6.3" r="2.7"/>
  <!-- beak -->
  <path d="M6.0 4.9 2.6 6.2 6.0 7.55z"/>
  <!-- wattle -->
  <circle cx="7.3" cy="8.9" r="1.2"/>
  <!-- neck, into the shoulders -->
  <path d="M6.05 7.9c.5 2.0 1.6 3.5 3.3 4.4l3.6-2.6c-1.3-.8-2.2-2.0-2.5-3.5z"/>
  <!-- body: deep breast in front, mass carrying back to the tail -->
  <circle cx="9.9" cy="13.9" r="4.35"/>
  <ellipse cx="12.6" cy="14.2" rx="6.0" ry="4.85" transform="rotate(-12 12.6 14.2)"/>
  <!-- tail: one solid fan, notched twice -->
  <path d="M15.6 11.3c1.8-3.1 3.9-5.3 6.5-6.7-.8 2.0-1.1 3.7-.85 5.05 1.2-.7 2.3-.95 3.25-.75-1.5 1.35-2.4 2.85-2.7 4.5.95-.1 1.85.1 2.6.6-2.25.35-4.0 1.35-5.25 3.0z"/>
  <!-- legs -->
  <path d="M9.85 17.9h1.95v3.3H9.85z"/>
  <path d="M13.4 17.9h1.95v3.3H13.4z"/>
  <!-- toes -->
  <path d="M8.15 20.85h4.15v1.65H8.15z"/>
  <path d="M11.7 20.85h4.15v1.65H11.7z"/>
</svg>
