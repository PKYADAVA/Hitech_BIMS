components:
  schemas:
    BirdSale:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        sale_no:
          type: string
          readOnly: true
          description: Auto-generated transaction number, e.g. BS-2627-0001
        date:
          type: string
          format: date
        doc_no:
          type: string
          description: External/reference document number
          maxLength: 100
        sale_type:
          $ref: '#/components/schemas/SaleTypeEnum'
        birds:
          type: integer
          maximum: 2147483647
          minimum: 0
        net_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Net weight in Kgs
        avg_weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          description: Net weight / Birds
        rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          description: Rate per Kg
        round_off:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          readOnly: true
          description: Net weight x Rate + RoundOff
        vehicle:
          type: string
          maxLength: 50
        driver:
          type: string
          maxLength: 100
        remarks:
          type: string
          maxLength: 255
        entry_time:
          type: string
          format: date-time
          readOnly: true
        customer:
          type: integer
          nullable: true
        farmer:
          type: integer
          nullable: true
        farm:
          type: integer
        batch:
          type: integer
          nullable: true
          description: Auto-set to the farm's active batch at the time of sale
        lifting_supervisor:
          type: integer
          nullable: true
        entry_by:
          type: integer
          nullable: true
      required:
      - amount
      - avg_weight
      - entry_time
      - farm
      - id
      - sale_no
    BirdSaleReceipt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        receipt_no:
          type: string
          readOnly: true
          description: Auto-generated transaction number, e.g. RC-2627-0001
        date:
          type: string
          format: date
        sale_type:
          $ref: '#/components/schemas/SaleTypeEnum'
        mode:
          $ref: '#/components/schemas/ModeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        reference_no:
          type: string
          maxLength: 100
        remarks:
          type: string
          maxLength: 255
        entry_time:
          type: string
          format: date-time
          readOnly: true
        location:
          type: integer
        customer:
          type: integer
          nullable: true
        farmer:
          type: integer
          nullable: true
        receipt_account:
          type: integer
        entry_by:
          type: integer
          nullable: true
      required:
      - entry_time
      - id
      - location
      - receipt_account
      - receipt_no
    BirdSaleReceiptRequest:
      type: object
