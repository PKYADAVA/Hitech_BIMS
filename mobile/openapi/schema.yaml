openapi: 3.0.3
info:
  title: Hitech BIMS Mobile API
  version: 1.0.0
  description: JWT-authenticated REST API (v1) consumed by the mobile app.
paths:
  /api/v1/auth/login:
    post:
      operationId: auth_login_create
      description: Shared v1 wiring for the SimpleJWT views (envelope + error shape).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout:
    post:
      operationId: auth_logout_create
      description: Blacklist a refresh token → logs out that one device/session.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/me:
    get:
      operationId: auth_me_retrieve
      description: Return the authenticated user's profile.
      tags:
      - auth
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh_create
      description: Shared v1 wiring for the SimpleJWT views (envelope + error shape).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/broiler/batches/:
    get:
      operationId: broiler_batches_list
      description: List + retrieve only — for master/reference data used as mobile
        pickers.
      parameters:
      - name: ordering
